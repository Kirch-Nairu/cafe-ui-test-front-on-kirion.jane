name: Jane Cafe J1-J2 Preview Checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Domain tests
        run: npm test
      - name: Build application
        run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser journeys at three viewports
        run: npm run test:e2e
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jane-cafe-browser-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
      - name: Retain generated dependency lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jane-cafe-package-lock
          path: package-lock.json
          if-no-files-found: ignore
